spring:
  application:
    name: core-api
  datasource:
    url: jdbc:postgresql://localhost:5433/teampulse
    username: teampulse
    password: teampulse
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
